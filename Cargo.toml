[package]
name = "momonados"
version = "0.1.0"
edition = "2021"

[dependencies]
libm = "0.2"
imasm_core = { path = "../2m3iosis/imasm_core", default-features = false }

[[bin]]
name = "momonados"
path = "src/main.rs"

[features]
vita = []
# Run on any host that has Rust, without QEMU and without bare metal. The
# kernel's own code is unchanged: 67 of its 71 modules are already portable
# no_std Rust, and only serial, interrupts, the entry point and one halt in the
# REPL touch the machine.
hosted = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
